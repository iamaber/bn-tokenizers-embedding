name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24.x', stable]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting, tests and static analysis
        shell: bash
        run: |
          test -z "$(gofmt -l tokenizer corpus internal cmd)"
          go test -race ./...
          go vet ./...
      - name: Build CLI without CGo
        run: go build -o bin/bntok ./cmd/bntok
        env:
          CGO_ENABLED: '0'

  wheel:
    name: Python ${{ matrix.python }} wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and lint tools
        run: python -m pip install build ruff
      - name: Lint Python
        run: |
          ruff check setup.py src/bn_tokenizers_embedding tests benchmarks
          ruff format --check setup.py src/bn_tokenizers_embedding tests benchmarks
      - name: Build sdist and then wheel from sdist
        run: python -m build
      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --no-index --no-deps dist/*.whl
      - name: Test installed native wheel
        shell: bash
        env:
          BNTOK_GO: /no-runtime-go-compiler
          CGO_ENABLED: '0'
        run: |
          "$RUNNER_TEMP/wheel-test/bin/python" -c 'import pathlib, sys, bn_tokenizers_embedding as p; assert pathlib.Path(p.__file__).is_relative_to(sys.prefix)'
          "$RUNNER_TEMP/wheel-test/bin/python" -m unittest discover -s tests -v
      - name: Benchmark harness smoke test (tiny fixture, not a trained model)
        shell: bash
        run: |
          "$RUNNER_TEMP/wheel-test/bin/python" benchmarks/python_api.py --iterations 2 --repeats 2 --batch-size 4 > benchmark-smoke.json
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*
            benchmark-smoke.json
          if-no-files-found: error
          retention-days: 7
